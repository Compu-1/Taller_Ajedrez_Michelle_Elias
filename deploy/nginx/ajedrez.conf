# Sitio nginx para el front del Ajedrez (build de webpack en /var/www/ajedrez).
# El navegador se conecta directo al servidor Ice por WebSocket en el puerto 10002
# del mismo host desde el que se cargó la página.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/ajedrez;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos de assets/ llevan hash en el nombre, se pueden cachear
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
